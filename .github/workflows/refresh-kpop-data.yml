name: Refresh K-pop live data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/refresh-now.txt"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-kpop-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to live data branch
        run: |
          git config user.name "hallyuscope-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin live-data
          git switch live-data
          # Remember the live-data tip so generated data is never clobbered by main.
          LIVE_TIP=$(git rev-parse HEAD)
          # main and live-data both edit code files (api/, review.js, ...), so a
          # plain merge conflicts and kills the whole hourly refresh (Nov 10 run
          # failed exactly here). Favour main for code conflicts; data is
          # regenerated by the fetch steps below anyway.
          if ! git merge -X theirs origin/main --no-edit; then
            git merge --abort
            git checkout origin/main -- api article.html article.js concert-calendar.js review.js script.js vercel.json .github scripts
            git add -A
            git commit -m "chore: sync code from main (merge conflict fallback)" || true
          fi
          # Restore live-data's generated data/covers: main only carries stale copies.
          git checkout "$LIVE_TIP" -- data/ assets/editorial/ || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch current K-pop data
        run: node scripts/fetch-kpop-data.mjs

      - name: Build social post candidates
        continue-on-error: true
        run: node scripts/build-social-post-data.mjs

      - name: Draft HallyuScope articles with AI
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DRAFT_MODEL: gpt-6.1-terra
          MAX_NEW_DRAFTS_PER_RUN: 50
        run: node scripts/generate-article-drafts.mjs

      - name: Commit refreshed data without deploying Vercel
        run: |
          git config user.name "hallyuscope-data-bot"
          git config user.email "actions@users.noreply.github.com"

          if ! git diff --quiet -- data/ assets/editorial/; then
            git add data/ assets/editorial/
            git commit -m "data: refresh live K-pop content"
          fi

          git push origin live-data
