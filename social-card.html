<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HallyuScope Social Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/social-card.css">
</head>
<body>
  <main class="stage">
    <article class="social-card" id="socialCard">
      <img class="social-card__photo" id="cardPhoto" alt="">
      <div class="social-card__fade" aria-hidden="true"></div>
      <img class="social-card__logo" src="/assets/hallyuscope-logo.png" alt="HallyuScope">

      <div class="social-card__content">
        <div class="social-card__category" id="cardCategory">K-POP</div>
        <h1 class="social-card__headline" id="cardHeadline">Headline goes here</h1>
        <p class="social-card__description" id="cardDescription">A short description sits naturally below the headline.</p>
      </div>
    </article>
  </main>
  <script src="/social-card.js" defer></script>
</body>
</html>
